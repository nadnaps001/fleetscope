[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleetscope"
version = "0.1.0"
description = "Reproducible NYC yellow-taxi pickup forecasting and historical replay"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2,<2", "pandas>=2.2,<4", "numpy>=2,<3", "pyarrow>=19",
  "lightgbm>=4.6,<5", "scikit-learn>=1.6,<2", "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1", "tzdata>=2025.1", "pyshp>=2.3,<3", "pyproj>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11"]

[project.scripts]
fleetscope = "fleetscope.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetscope"]
